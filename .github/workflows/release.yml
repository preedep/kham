name: Release

# Triggered by a version tag: v0.1.0, v1.2.3, etc.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Gate: full CI suite must pass before any publish step runs
  # ---------------------------------------------------------------------------
  ci_check:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------------------
  # Build kham-cli + kham-sqlite binaries for each platform
  #
  # kham-sqlite build.rs supports macOS (xcrun/brew) and Linux (pkg-config).
  # Windows has no SQLite header path wired up, so sqlite is skipped there.
  # ---------------------------------------------------------------------------
  build_binaries:
    name: Binaries / ${{ matrix.target }}
    needs: ci_check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            sqlite: true
            archive: tar.gz
            exe: ""
            lib_prefix: lib
            lib_ext: so
          - os: macos-latest
            target: x86_64-apple-darwin
            sqlite: true
            archive: tar.gz
            exe: ""
            lib_prefix: lib
            lib_ext: dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            sqlite: true
            archive: tar.gz
            exe: ""
            lib_prefix: lib
            lib_ext: dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sqlite: true
            archive: zip
            exe: .exe
            lib_prefix: ""
            lib_ext: dll
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install SQLite headers (Linux)
        if: matrix.sqlite && runner.os == 'Linux'
        run: sudo apt-get install -y libsqlite3-dev
      - name: Install SQLite headers (Windows via vcpkg)
        if: matrix.sqlite && runner.os == 'Windows'
        run: vcpkg install sqlite3:x64-windows
      - name: Build kham-cli
        run: cargo build -p kham-cli --release --target ${{ matrix.target }}
      - name: Build kham-sqlite
        if: matrix.sqlite
        run: cargo build -p kham-sqlite --release --target ${{ matrix.target }}
      - name: Package artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          TARGET="${{ matrix.target }}"
          EXE="${{ matrix.exe }}"
          LIB_PREFIX="${{ matrix.lib_prefix }}"
          LIB_EXT="${{ matrix.lib_ext }}"
          ARCHIVE="${{ matrix.archive }}"

          mkdir -p dist

          # --- kham-cli ---
          CLI_BIN="target/${TARGET}/release/kham${EXE}"
          CLI_NAME="kham-cli-${VERSION}-${TARGET}"
          cp "$CLI_BIN" dist/

          if [ "$ARCHIVE" = "zip" ]; then
            (cd dist && 7z a "${CLI_NAME}.zip" "kham${EXE}" > /dev/null && rm "kham${EXE}")
          else
            (cd dist && tar czf "${CLI_NAME}.tar.gz" "kham${EXE}" && rm "kham${EXE}")
          fi

          # --- kham-sqlite ---
          if [ "${{ matrix.sqlite }}" = "true" ]; then
            SQLITE_LIB="target/${TARGET}/release/${LIB_PREFIX}kham_sqlite.${LIB_EXT}"
            SQLITE_NAME="kham-sqlite-${VERSION}-${TARGET}"
            cp "$SQLITE_LIB" dist/
            LIB_FILE="${LIB_PREFIX}kham_sqlite.${LIB_EXT}"
            if [ "$ARCHIVE" = "zip" ]; then
              (cd dist && 7z a "${SQLITE_NAME}.zip" "$LIB_FILE" > /dev/null && rm "$LIB_FILE")
            else
              (cd dist && tar czf "${SQLITE_NAME}.tar.gz" "$LIB_FILE" && rm "$LIB_FILE")
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/

  # ---------------------------------------------------------------------------
  # Build kham-sqlite for Android (4 ABIs via Android NDK)
  #
  # The built-in Android SQLite has load_extension disabled; users must link
  # against sqlite-android (or SQLCipher) which re-enables it.
  # sqlite3ext.h is not in the NDK sysroot, so we download the SQLite
  # amalgamation and set SQLITE_INCLUDE_DIR to that directory.
  # ---------------------------------------------------------------------------
  build_android:
    name: kham-sqlite / Android / ${{ matrix.abi }}
    needs: ci_check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            ndk_triple: aarch64-linux-android
            api: 21
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
            ndk_triple: armv7a-linux-androideabi
            api: 21
          - abi: x86_64
            target: x86_64-linux-android
            ndk_triple: x86_64-linux-android
            api: 21
          - abi: x86
            target: i686-linux-android
            ndk_triple: i686-linux-android
            api: 21
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.target }}
      - name: Download SQLite amalgamation (provides sqlite3ext.h)
        run: |
          curl -fsSL https://www.sqlite.org/2024/sqlite-amalgamation-3470200.zip -o sqlite-amal.zip
          unzip -q sqlite-amal.zip
          echo "SQLITE_INCLUDE_DIR=$PWD/sqlite-amalgamation-3470200" >> $GITHUB_ENV
      - name: Set up NDK toolchain environment
        run: |
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CLANG="${NDK_BIN}/${{ matrix.ndk_triple }}${{ matrix.api }}-clang"
          TARGET="${{ matrix.target }}"
          TARGET_UPPER=$(echo "$TARGET" | tr '[:lower:]-' '[:upper:]_')
          TARGET_UNDER=$(echo "$TARGET" | tr '-' '_')
          echo "CARGO_TARGET_${TARGET_UPPER}_LINKER=$CLANG" >> $GITHUB_ENV
          echo "CC_${TARGET_UNDER}=$CLANG"                  >> $GITHUB_ENV
          echo "AR_${TARGET_UNDER}=${NDK_BIN}/llvm-ar"      >> $GITHUB_ENV
      - name: Build kham-sqlite
        run: cargo build -p kham-sqlite --release --target ${{ matrix.target }}
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ABI="${{ matrix.abi }}"
          TARGET="${{ matrix.target }}"
          mkdir -p dist
          cp "target/$TARGET/release/libkham_sqlite.so" dist/
          (cd dist && zip "kham-sqlite-${VERSION}-android-${ABI}.zip" libkham_sqlite.so \
            && rm libkham_sqlite.so)
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: dist/

  # ---------------------------------------------------------------------------
  # Build kham-pg for Linux x86_64 against PostgreSQL 16 and 17
  #
  # The .so must match the major PG version it will be loaded into, so we
  # build once per version and ship both. macOS/Windows are not supported
  # because pg_config availability is not guaranteed on those runners.
  # ---------------------------------------------------------------------------
  build_pg:
    name: kham-pg / PG ${{ matrix.pg }} / ${{ matrix.arch }}
    needs: ci_check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: pg${{ matrix.pg }}-${{ matrix.arch }}
      - name: Add PostgreSQL apt repository
        run: |
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] \
            https://apt.postgresql.org/pub/repos/apt \
            $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
      - name: Install postgresql-server-dev-${{ matrix.pg }}
        run: sudo apt-get install -y postgresql-server-dev-${{ matrix.pg }}
      - name: Build kham-pg
        run: cargo build -p kham-pg --release
        env:
          PG_CONFIG: /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PG="${{ matrix.pg }}"
          TARGET="${{ matrix.target }}"
          mkdir -p dist
          cp target/release/libkham_pg.so dist/
          (cd dist && tar czf "kham-pg-${VERSION}-pg${PG}-${TARGET}.tar.gz" \
            libkham_pg.so && rm libkham_pg.so)
      - uses: actions/upload-artifact@v4
        with:
          name: kham-pg-pg${{ matrix.pg }}-${{ matrix.arch }}
          path: dist/

  # ---------------------------------------------------------------------------
  # Publish kham-core then kham-cli to crates.io
  # ---------------------------------------------------------------------------
  publish_crates:
    name: Publish to crates.io
    needs: ci_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Publish core first — cli depends on it
      - name: Publish kham-core
        run: cargo publish -p kham-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || true
      # crates.io index propagation — 30 s is usually enough
      - name: Wait for crates.io index
        run: sleep 30
      - name: Publish kham-cli
        run: cargo publish -p kham-cli --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || true

  # ---------------------------------------------------------------------------
  # Build Python wheels (manylinux + macOS universal2 + Windows)
  #
  # kham-python uses pyo3 abi3-py38: maturin builds ONE wheel per
  # platform/arch that runs on Python 3.8+. No --interpreter list needed.
  # ---------------------------------------------------------------------------
  build_python_wheels:
    name: Python wheel / ${{ matrix.os }} ${{ matrix.target }}
    needs: ci_check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — manylinux via Docker
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          # Linux aarch64 — manylinux via QEMU
          - os: ubuntu-latest
            target: aarch64
            manylinux: auto
          # macOS x86_64 — cross-compiled on macos-latest (arm64)
          - os: macos-latest
            target: x86_64
            manylinux: ""
          # macOS arm64 (M1/M2 runner)
          - os: macos-latest
            target: aarch64
            manylinux: ""
          # Windows x86_64
          - os: windows-latest
            target: x86_64
            manylinux: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel (Linux manylinux)
        if: matrix.manylinux != ''
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --manifest-path kham-python/Cargo.toml
      - name: Build wheel (non-Linux)
        if: matrix.manylinux == ''
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path kham-python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  publish_pypi:
    name: Publish to PyPI
    needs: build_python_wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kham/
    permissions:
      id-token: write # OIDC trusted publishing — no secret needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip_existing: true

  # ---------------------------------------------------------------------------
  # Build WASM package and publish to npm
  # ---------------------------------------------------------------------------
  publish_npm:
    name: Publish to npm
    needs: ci_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"
      - name: Build WASM package
        run: wasm-pack build kham-wasm --target web --release
      - name: Publish to npm
        working-directory: kham-wasm/pkg
        run: npm publish --access public || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ---------------------------------------------------------------------------
  # Publish kham-pg to PGXN
  #
  # Requires GitHub secrets: PGXN_USERNAME, PGXN_PASSWORD
  # PGXN Manager upload API: POST https://manager.pgxn.org/upload (Basic Auth)
  # ---------------------------------------------------------------------------
  publish_pgxn:
    name: Publish to PGXN
    needs: ci_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get install -y zip
      - name: Build PGXN distribution zip
        run: make -C kham-pg dist
      - name: Upload to PGXN
        run: |
          curl --fail-with-body -sSL \
            -u "${{ secrets.PGXN_USERNAME }}:${{ secrets.PGXN_PASSWORD }}" \
            -F "archive=@kham-pg/kham_pg-$(make -C kham-pg -s print-version).zip" \
            https://manager.pgxn.org/upload
      - uses: actions/upload-artifact@v4
        with:
          name: pgxn-dist
          path: kham-pg/kham_pg-*.zip

  # ---------------------------------------------------------------------------
  # Build and push postgres+kham-pg Docker images to Docker Hub
  #
  # Requires GitHub secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
  #
  # Per-arch images are built on native runners (no QEMU), then combined
  # into a multi-arch manifest by the docker_manifest job.
  #
  # Tags produced:
  #   <user>/kham-pg:<version>-pg<N>   — multi-arch (amd64 + arm64), PG 14–18
  #   <user>/kham-pg:latest            — alias for <version>-pg17
  # ---------------------------------------------------------------------------
  build_docker:
    name: Docker / PG ${{ matrix.pg }} / ${{ matrix.arch }}
    needs: build_pg
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pg: 14, arch: amd64, runner: ubuntu-latest,     artifact_arch: x86_64  }
          - { pg: 14, arch: arm64, runner: ubuntu-24.04-arm,  artifact_arch: aarch64 }
          - { pg: 15, arch: amd64, runner: ubuntu-latest,     artifact_arch: x86_64  }
          - { pg: 15, arch: arm64, runner: ubuntu-24.04-arm,  artifact_arch: aarch64 }
          - { pg: 16, arch: amd64, runner: ubuntu-latest,     artifact_arch: x86_64  }
          - { pg: 16, arch: arm64, runner: ubuntu-24.04-arm,  artifact_arch: aarch64 }
          - { pg: 17, arch: amd64, runner: ubuntu-latest,     artifact_arch: x86_64  }
          - { pg: 17, arch: arm64, runner: ubuntu-24.04-arm,  artifact_arch: aarch64 }
          - { pg: 18, arch: amd64, runner: ubuntu-latest,     artifact_arch: x86_64  }
          - { pg: 18, arch: arm64, runner: ubuntu-24.04-arm,  artifact_arch: aarch64 }
    steps:
      - uses: actions/checkout@v4
      - name: Download kham-pg artifact
        uses: actions/download-artifact@v4
        with:
          name: kham-pg-pg${{ matrix.pg }}-${{ matrix.artifact_arch }}
          path: docker-build/
      - name: Prepare build context
        run: |
          cd docker-build
          tar xzf kham-pg-*.tar.gz
          cp ../kham-pg/kham_pg.control .
          mkdir -p sql
          cp ../kham-pg/sql/*.sql sql/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: docker-build/
          file: kham-pg/Dockerfile.hub
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kham-pg:${{ github.ref_name }}-pg${{ matrix.pg }}-${{ matrix.arch }}
          build-args: |
            PG_VERSION=${{ matrix.pg }}
            KHAM_VERSION=${{ github.ref_name }}

  docker_manifest:
    name: Docker manifest / PG ${{ matrix.pg }}
    needs: build_docker
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18]
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create multi-arch manifest
        run: |
          VERSION="${{ github.ref_name }}"
          PG="${{ matrix.pg }}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/kham-pg"
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}-pg${PG}" \
            "${IMAGE}:${VERSION}-pg${PG}-amd64" \
            "${IMAGE}:${VERSION}-pg${PG}-arm64"
      - name: Update latest tag (PG 17 only)
        if: matrix.pg == 17
        run: |
          VERSION="${{ github.ref_name }}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/kham-pg"
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}-pg17-amd64" \
            "${IMAGE}:${VERSION}-pg17-arm64"

  # ---------------------------------------------------------------------------
  # GitHub Release — auto-generate notes and attach all artifacts as assets
  # ---------------------------------------------------------------------------
  github_release:
    name: GitHub Release
    needs: [publish_crates, publish_pypi, publish_npm, publish_pgxn, build_binaries, build_pg, build_android, docker_manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for auto release notes
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: kham-pg-pg*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: pgxn-dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: android-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_call:   # allows release.yml to call this as a gate

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # -------------------------------------------------------------------------
  # Formatting check — fast, runs first to fail early
  # -------------------------------------------------------------------------
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # -------------------------------------------------------------------------
  # Clippy lints
  # -------------------------------------------------------------------------
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # -------------------------------------------------------------------------
  # Core tests — matrix of stable + MSRV across Linux / macOS
  # -------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.toolchain }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: [stable, "1.75"]   # stable + MSRV

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.toolchain }}

      # Build and test default-members (kham-core, kham-cli, kham-capi)
      - name: Build
        run: cargo build --workspace --exclude kham-python --exclude kham-wasm

      - name: Unit + integration tests
        run: cargo test --workspace --exclude kham-python --exclude kham-wasm

      # Doc-tests separately so failures are easier to triage
      - name: Doc tests
        run: cargo test --doc --workspace --exclude kham-python --exclude kham-wasm

  # -------------------------------------------------------------------------
  # no_std check — kham-core must compile without std
  # -------------------------------------------------------------------------
  no_std:
    name: no_std (kham-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Build kham-core for no_std target
        run: >
          cargo build -p kham-core
          --no-default-features
          --target thumbv7em-none-eabihf

  # -------------------------------------------------------------------------
  # WASM build — wasm-pack build must succeed
  # -------------------------------------------------------------------------
  wasm:
    name: WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: wasm-pack build
        run: wasm-pack build kham-wasm --target web --release

  # -------------------------------------------------------------------------
  # Python wheel build check — maturin develop must succeed
  # -------------------------------------------------------------------------
  python:
    name: Python wheel (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install maturin
        run: pip install maturin
      - name: maturin develop
        run: maturin develop -m kham-python/Cargo.toml

  # -------------------------------------------------------------------------
  # Benchmarks — compile-check only (no timing assertions)
  # -------------------------------------------------------------------------
  bench_compile:
    name: Bench compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p kham-core --no-run

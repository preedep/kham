name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_call: # allows release.yml to call this as a gate

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # CORE CHECKS — must be green; block merge on failure
  # ---------------------------------------------------------------------------

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # kham-pg requires PostgreSQL server headers (pg_config) — tested via Docker.
      # kham-python needs Python headers; kham-wasm needs the wasm32 target.
      # kham-sqlite needs SQLite headers for the C shim.
      - run: sudo apt-get install -y libsqlite3-dev
      - run: >
          cargo clippy
          --workspace
          --exclude kham-python
          --exclude kham-wasm
          --exclude kham-pg
          --all-targets
          -- -D warnings

  test:
    name: Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.85"] # stable + MSRV
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
      - name: Install SQLite headers
        run: sudo apt-get install -y libsqlite3-dev
      - name: Build workspace
        run: >
          cargo build
          --workspace
          --exclude kham-python
          --exclude kham-wasm
          --exclude kham-pg
      - name: Build kham-sqlite cdylib (required by integration tests)
        run: cargo build -p kham-sqlite
      - name: Unit + integration tests
        run: >
          cargo test
          --workspace
          --exclude kham-python
          --exclude kham-wasm
          --exclude kham-pg
      - name: Doc tests
        run: >
          cargo test --doc
          --workspace
          --exclude kham-python
          --exclude kham-wasm
          --exclude kham-pg

  bench_compile:
    name: Bench compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p kham-core --no-run

  pg_regress:
    name: pg_regress (Docker / PG 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Run pg_regress (67 tests across 4 suites)
        run: make -C kham-pg regress

  # ---------------------------------------------------------------------------
  # EXTENDED CHECKS — informational; failures don't block CI
  # Harden one by one: remove continue-on-error when confirmed green.
  # ---------------------------------------------------------------------------

  no_std:
    name: no_std check (kham-core)
    runs-on: ubuntu-latest
    # cargo check avoids invoking the linker, so no arm-none-eabi-gcc needed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: cargo check for bare-metal target
        run: >
          cargo check -p kham-core
          --no-default-features
          --target thumbv7em-none-eabihf

  wasm:
    name: WASM build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"
      - name: Unit tests (native, cargo test)
        run: cargo test -p kham-wasm
      - name: wasm-pack build
        run: wasm-pack build kham-wasm --target web --release

  python:
    name: Python wheel (3.${{ matrix.minor }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        minor: [11, 12] # 3.8 is EOL; wheel still runs on 3.8+ via abi3-py38
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.${{ matrix.minor }}"
      - run: pip install maturin virtualenv
      - run: python -m virtualenv .venv
      - name: Build Python wheel (maturin develop)
        run: maturin develop -m kham-python/Cargo.toml
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
      - name: Install pytest into venv
        run: .venv/bin/pip install pytest
      - name: Run pytest
        run: .venv/bin/pytest kham-python/tests/ -v

  # macOS smoke-test — same code, different OS; informational until
  # we're confident the matrix is worth the runner cost.
  test_macos:
    name: Test (macOS / stable)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build kham-sqlite cdylib (required by integration tests)
        run: cargo build -p kham-sqlite
      - run: >
          cargo test
          --workspace
          --exclude kham-python
          --exclude kham-wasm
          --exclude kham-pg

---
# docker-compose.yml — runs the kham-pg benchmark suite.
#
# Usage:
#   docker compose -f kham-pg/bench/docker-compose.yml up --build --exit-code-from bench
#
# Or via the Makefile shortcut:
#   make -C kham-pg bench

services:
  bench:
    build:
      context: ../..          # repository root — gives access to full workspace
      dockerfile: kham-pg/bench/Dockerfile.bench
    # No persistent volumes needed; everything lives in the container.

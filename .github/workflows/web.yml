name: Deploy kham-web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'kham-web/**'
      - 'kham-wasm/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build kham-wasm
        run: wasm-pack build kham-wasm --target web --release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kham-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: kham-web

      - name: Build site
        run: npm run build
        working-directory: kham-web

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: kham-web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

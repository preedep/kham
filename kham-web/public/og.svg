<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle glow circle behind badge -->
  <circle cx="196" cy="245" r="180" fill="url(#glow)"/>

  <!-- Logo badge -->
  <rect x="72" y="130" width="248" height="248" rx="44" fill="url(#badge)"/>

  <!-- คำ inside badge -->
  <text x="196" y="305" font-family="system-ui,-apple-system,sans-serif" font-size="148" font-weight="700" text-anchor="middle" fill="white" opacity="0.97">คำ</text>

  <!-- kham wordmark -->
  <text x="356" y="272" font-family="system-ui,-apple-system,sans-serif" font-size="128" font-weight="700" letter-spacing="-2" fill="#f8fafc">kham</text>

  <!-- Version badge -->
  <rect x="356" y="300" width="152" height="34" rx="17" fill="#1d4ed8" fill-opacity="0.55"/>
  <text x="432" y="323" font-family="system-ui,-apple-system,sans-serif" font-size="19" font-weight="600" fill="#93c5fd" text-anchor="middle">v0.5.0</text>

  <!-- Divider line -->
  <rect x="72" y="416" width="560" height="1.5" fill="#334155" rx="1"/>

  <!-- Tagline -->
  <text x="72" y="458" font-family="system-ui,-apple-system,sans-serif" font-size="34" fill="#94a3b8" letter-spacing="0.2">Fast Thai word segmentation · Rust</text>

  <!-- Sub tagline -->
  <text x="72" y="502" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#475569">no_std · WASM · Python · PostgreSQL · SQLite · C FFI</text>

  <!-- Domain -->
  <text x="1128" y="594" font-family="ui-monospace,monospace" font-size="22" fill="#334155" text-anchor="end">kham.io</text>
</svg>

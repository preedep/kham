name: Release

# Triggered by a version tag: v0.1.0, v1.2.3, etc.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------------------------------------
  # Gate: run the full CI test suite before publishing anything
  # -------------------------------------------------------------------------
  ci_check:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  # -------------------------------------------------------------------------
  # Publish kham-core and kham-cli to crates.io
  # -------------------------------------------------------------------------
  publish_crates:
    name: Publish to crates.io
    needs: ci_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Publish kham-core first — kham-cli depends on it
      - name: Publish kham-core
        run: cargo publish -p kham-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # crates.io index needs a moment to become consistent
      - name: Wait for crates.io index
        run: sleep 20

      - name: Publish kham-cli
        run: cargo publish -p kham-cli --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # -------------------------------------------------------------------------
  # Build Python wheels (manylinux + macOS + Windows) and publish to PyPI
  # -------------------------------------------------------------------------
  build_python_wheels:
    name: Python wheel / ${{ matrix.target }}
    needs: ci_check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: >
            --release
            --out dist
            --manifest-path kham-python/Cargo.toml
            --interpreter python3.8 python3.9 python3.10 python3.11 python3.12
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  publish_pypi:
    name: Publish to PyPI
    needs: build_python_wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kham/
    permissions:
      id-token: write   # OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # -------------------------------------------------------------------------
  # Build WASM package and publish to npm
  # -------------------------------------------------------------------------
  publish_npm:
    name: Publish to npm
    needs: ci_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM package
        run: wasm-pack build kham-wasm --target web --release
      - name: Publish to npm
        working-directory: kham-wasm/pkg
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # -------------------------------------------------------------------------
  # GitHub Release — attach build artifacts and auto-generate release notes
  # -------------------------------------------------------------------------
  github_release:
    name: GitHub Release
    needs: [publish_crates, publish_pypi, publish_npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for release notes

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

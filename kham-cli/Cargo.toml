[package]
name = "kham-cli"
description = "Command-line interface for the kham Thai word segmenter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "kham"
path = "src/main.rs"

[dependencies]
kham-core = { workspace = true, features = ["std"] }
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
colored = "2"

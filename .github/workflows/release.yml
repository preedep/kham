name: Release

# Triggered by a version tag: v0.1.0, v1.2.3, etc.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Gate: full CI suite must pass before any publish step runs
  # ---------------------------------------------------------------------------
  ci_check:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------------------
  # Build kham-cli + kham-sqlite binaries for each platform
  #
  # kham-sqlite build.rs supports macOS (xcrun/brew) and Linux (pkg-config).
  # Windows has no SQLite header path wired up, so sqlite is skipped there.
  # ---------------------------------------------------------------------------
  build_binaries:
    name: Binaries / ${{ matrix.target }}
    needs: ci_check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            sqlite: true
            archive: tar.gz
            exe: ""
            lib_prefix: lib
            lib_ext: so
          - os: macos-13
            target: x86_64-apple-darwin
            sqlite: true
            archive: tar.gz
            exe: ""
            lib_prefix: lib
            lib_ext: dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            sqlite: true
            archive: tar.gz
            exe: ""
            lib_prefix: lib
            lib_ext: dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sqlite: false
            archive: zip
            exe: .exe
            lib_prefix: ""
            lib_ext: dll
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install SQLite headers (Linux)
        if: matrix.sqlite && runner.os == 'Linux'
        run: sudo apt-get install -y libsqlite3-dev
      - name: Build kham-cli
        run: cargo build -p kham-cli --release
      - name: Build kham-sqlite
        if: matrix.sqlite
        run: cargo build -p kham-sqlite --release
      - name: Package artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          TARGET="${{ matrix.target }}"
          EXE="${{ matrix.exe }}"
          LIB_PREFIX="${{ matrix.lib_prefix }}"
          LIB_EXT="${{ matrix.lib_ext }}"
          ARCHIVE="${{ matrix.archive }}"

          mkdir -p dist

          # --- kham-cli ---
          CLI_BIN="target/release/kham${EXE}"
          CLI_NAME="kham-cli-${VERSION}-${TARGET}"
          cp "$CLI_BIN" dist/

          if [ "$ARCHIVE" = "zip" ]; then
            (cd dist && zip "${CLI_NAME}.zip" "kham${EXE}" && rm "kham${EXE}")
          else
            (cd dist && tar czf "${CLI_NAME}.tar.gz" "kham${EXE}" && rm "kham${EXE}")
          fi

          # --- kham-sqlite (Unix only) ---
          if [ "${{ matrix.sqlite }}" = "true" ]; then
            SQLITE_LIB="target/release/${LIB_PREFIX}kham_sqlite.${LIB_EXT}"
            SQLITE_NAME="kham-sqlite-${VERSION}-${TARGET}"
            cp "$SQLITE_LIB" dist/
            LIB_FILE="${LIB_PREFIX}kham_sqlite.${LIB_EXT}"
            (cd dist && tar czf "${SQLITE_NAME}.tar.gz" "$LIB_FILE" && rm "$LIB_FILE")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/

  # ---------------------------------------------------------------------------
  # Build kham-pg for Linux x86_64 against PostgreSQL 16 and 17
  #
  # The .so must match the major PG version it will be loaded into, so we
  # build once per version and ship both. macOS/Windows are not supported
  # because pg_config availability is not guaranteed on those runners.
  # ---------------------------------------------------------------------------
  build_pg:
    name: kham-pg / PG ${{ matrix.pg }} / Linux x86_64
    needs: ci_check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 17]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: pg${{ matrix.pg }}
      - name: Add PostgreSQL apt repository
        run: |
          sudo apt-get install -y curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] \
            https://apt.postgresql.org/pub/repos/apt \
            $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
      - name: Install postgresql-server-dev-${{ matrix.pg }}
        run: sudo apt-get install -y postgresql-server-dev-${{ matrix.pg }}
      - name: Build kham-pg
        run: cargo build -p kham-pg --release
        env:
          PG_CONFIG: /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PG="${{ matrix.pg }}"
          mkdir -p dist
          cp target/release/libkham_pg.so dist/
          (cd dist && tar czf "kham-pg-${VERSION}-pg${PG}-x86_64-unknown-linux-gnu.tar.gz" \
            libkham_pg.so && rm libkham_pg.so)
      - uses: actions/upload-artifact@v4
        with:
          name: kham-pg-pg${{ matrix.pg }}
          path: dist/

  # ---------------------------------------------------------------------------
  # Publish kham-core then kham-cli to crates.io
  # ---------------------------------------------------------------------------
  publish_crates:
    name: Publish to crates.io
    needs: ci_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Publish core first — cli depends on it
      - name: Publish kham-core
        run: cargo publish -p kham-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || true
      # crates.io index propagation — 30 s is usually enough
      - name: Wait for crates.io index
        run: sleep 30
      - name: Publish kham-cli
        run: cargo publish -p kham-cli --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || true

  # ---------------------------------------------------------------------------
  # Build Python wheels (manylinux + macOS universal2 + Windows)
  #
  # kham-python uses pyo3 abi3-py38: maturin builds ONE wheel per
  # platform/arch that runs on Python 3.8+. No --interpreter list needed.
  # ---------------------------------------------------------------------------
  build_python_wheels:
    name: Python wheel / ${{ matrix.os }} ${{ matrix.target }}
    needs: ci_check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — manylinux via Docker
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          # Linux aarch64 — manylinux via QEMU
          - os: ubuntu-latest
            target: aarch64
            manylinux: auto
          # macOS x86_64 (Intel runner)
          - os: macos-13
            target: x86_64
            manylinux: ""
          # macOS arm64 (M1/M2 runner)
          - os: macos-latest
            target: aarch64
            manylinux: ""
          # Windows x86_64
          - os: windows-latest
            target: x86_64
            manylinux: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel (Linux manylinux)
        if: matrix.manylinux != ''
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --manifest-path kham-python/Cargo.toml
      - name: Build wheel (non-Linux)
        if: matrix.manylinux == ''
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path kham-python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  publish_pypi:
    name: Publish to PyPI
    needs: build_python_wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kham/
    permissions:
      id-token: write # OIDC trusted publishing — no secret needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # ---------------------------------------------------------------------------
  # Build WASM package and publish to npm
  # ---------------------------------------------------------------------------
  publish_npm:
    name: Publish to npm
    needs: ci_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"
      - name: Build WASM package
        run: wasm-pack build kham-wasm --target web --release
      - name: Publish to npm
        working-directory: kham-wasm/pkg
        run: npm publish --access public || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ---------------------------------------------------------------------------
  # GitHub Release — auto-generate notes and attach all artifacts as assets
  # ---------------------------------------------------------------------------
  github_release:
    name: GitHub Release
    needs: [publish_crates, publish_pypi, publish_npm, build_binaries, build_pg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for auto release notes
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: kham-pg-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

name: Release

# Triggered by a version tag: v0.1.0, v1.2.3, etc.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Gate: full CI suite must pass before any publish step runs
  # ---------------------------------------------------------------------------
  ci_check:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------------------
  # Publish kham-core then kham-cli to crates.io
  # ---------------------------------------------------------------------------
  publish_crates:
    name: Publish to crates.io
    needs: ci_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Publish core first — cli depends on it
      - name: Publish kham-core
        run: cargo publish -p kham-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || true
      # crates.io index propagation — 30 s is usually enough
      - name: Wait for crates.io index
        run: sleep 30
      - name: Publish kham-cli
        run: cargo publish -p kham-cli --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || true

  # ---------------------------------------------------------------------------
  # Build Python wheels (manylinux + macOS universal2 + Windows)
  #
  # kham-python uses pyo3 abi3-py38: maturin builds ONE wheel per
  # platform/arch that runs on Python 3.8+. No --interpreter list needed.
  # ---------------------------------------------------------------------------
  build_python_wheels:
    name: Python wheel / ${{ matrix.os }} ${{ matrix.target }}
    needs: ci_check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — manylinux via Docker
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          # Linux aarch64 — manylinux via QEMU
          - os: ubuntu-latest
            target: aarch64
            manylinux: auto
          # macOS x86_64 (Intel runner)
          - os: macos-13
            target: x86_64
            manylinux: ""
          # macOS arm64 (M1/M2 runner)
          - os: macos-latest
            target: aarch64
            manylinux: ""
          # Windows x86_64
          - os: windows-latest
            target: x86_64
            manylinux: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel (Linux manylinux)
        if: matrix.manylinux != ''
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --manifest-path kham-python/Cargo.toml
      - name: Build wheel (non-Linux)
        if: matrix.manylinux == ''
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path kham-python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  publish_pypi:
    name: Publish to PyPI
    needs: build_python_wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kham/
    permissions:
      id-token: write # OIDC trusted publishing — no secret needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # ---------------------------------------------------------------------------
  # Build WASM package and publish to npm
  # ---------------------------------------------------------------------------
  publish_npm:
    name: Publish to npm
    needs: ci_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"
      - name: Build WASM package
        run: wasm-pack build kham-wasm --target web --release
      - name: Publish to npm
        working-directory: kham-wasm/pkg
        run: npm publish --access public || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ---------------------------------------------------------------------------
  # GitHub Release — auto-generate notes and attach wheel artifacts
  # ---------------------------------------------------------------------------
  github_release:
    name: GitHub Release
    needs: [publish_crates, publish_pypi, publish_npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for auto release notes
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

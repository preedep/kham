[workspace]
members = [
    "kham-core",
    "kham-cli",
    "kham-bench-accuracy",
    "kham-python",
    "kham-wasm",
    "kham-capi",
    "kham-pg",
    "kham-sqlite",
]
# kham-python requires `maturin develop`; kham-wasm requires `wasm-pack build`.
# kham-pg requires pg_config in PATH (or PG_CONFIG env var) to build.
# kham-sqlite requires SQLite headers (macOS SDK / libsqlite3-dev on Linux).
# Exclude them from the default `cargo build / test` invocation.
default-members = [
    "kham-core",
    "kham-cli",
    "kham-capi",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
authors = ["Preedee Ponchevin"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/preedep/kham"
readme = "README.md"

[workspace.dependencies]
kham-core = { path = "kham-core", version = "0.4.0" }

[profile.release]
opt-level = "z"
lto = true

# Benchmarks need speed, not size — override the release "z" opt-level.
[profile.bench]
inherits = "release"
opt-level = 3
lto = true
